<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>After Surprise 💖</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background:linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  transition:background-image 1.5s ease-in-out;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  color: white;
  overflow: hidden;
}
.container {
  text-align: center;
}
h1 {
  font-size: 22px;
  margin-bottom: 12px;
}
.image-box {
  width: 310px;
  height: 560px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 45px rgba(255,105,180,0.6);
  cursor: pointer;
}
.image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  
}
/* Animations */
.fade {
  animation: fade 1.2s forwards;
}
.zoom {
  animation: zoom 1.2s forwards;
}
.rotate {
  animation: rotate 1.2s forwards;
}
.slide {
  animation: slide 1.2s forwards;
}
.glow {
  animation: glow 1.2s forwards;
}
.bounce {
  animation: bounce 1.2s forwards;
}
.shake {
  animation: shake 1.2s forwards;
}
.pulse {
  animation: pulse 1.2s forwards;
}
.flip {
  animation: flip 1.2s forwards;
}
.swing {
  animation: swing 11.2s forwards;
}
.tumble {
  animation: tumble 11.2s forwards;
}

@keyframes fade {
  to { opacity: 1; }
}
@keyframes zoom {
  from { transform: scale(1.4); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes rotate {
  from { transform: rotate(-12deg) scale(1.2); opacity: 0; }
  to { transform: rotate(0) scale(1); opacity: 1; }
}
@keyframes slide {
  from { transform: translateY(80px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes glow {
  to { opacity: 1; box-shadow: 0 0 60px hotpink; }
}
@keyframes bounce {
  0% { transform: translateY(0); opacity: 0; }
  50% { transform: translateY(-20px); opacity: 1; }
  100% { transform: translateY(0); opacity: 1; }
}
@keyframes shake {
  0% { transform: translateX(0); opacity: 0; }
  25% { transform: translateX(-5px); opacity: 1; }
  50% { transform: translateX(5px); opacity: 1; }
  75% { transform: translateX(-5px); opacity: 1; }
  100% { transform: translateX(0); opacity: 1; }
}
@keyframes pulse {
  0% { transform: scale(0.8); opacity: 0; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes flip {
  from { transform: rotateY(90deg); opacity: 0; }
  to { transform: rotateY(0); opacity: 1; }
}
@keyframes swing {
  0% { transform: rotate(30deg); opacity: 0; }
  50% { transform: rotate(-30deg); opacity: 1; }
  100% { transform: rotate(0); opacity: 1; }
}
@keyframes tumble {
  0% { transform: rotate(360deg) scale(0); opacity: 0; }
  100% { transform: rotate(0) scale(1); opacity: 1; }
}
.tap {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.7;
}
</style>
</head>
<body>
<audio autoplay loop>
  <source src="bg-music.mp3" type="audio/mpeg">
</audio>
<div class="container">
  
  <div class="image-box" onclick="nextImage()">
    <img id="img">
  </div>
  <div class="tap">Tap karo… dil se ✨</div>
</div>
<audio id="birthday-song" loop>
  <source src="bdy-song.mp3" type="audio/mpeg">
</audio>

<script>
window.onload = function() {
  document.getElementById('birthday-song').play();
}
</script>
<script>
const images = [
  "1.jpg", 
  "2.jpg", 
  "3.jpg", 
  "4.jpg", 
  "5.jpg", 
  "6.jpg", 
  "7.jpg", 
  "8.jpg", 
  "9.jpg", 
  "10.jpg", 
  "11.jpg"
];
const effects = ["fade", "zoom", "rotate", "slide", "glow", 
  "bounce", "shake", "pulse", "flip", "swing", 
  "tumble"
];
let i = 0;
function nextImage() {
  if (i === images.length) {
    window.location.href = "secret-msg.html";
    return;
  }
  const img = document.getElementById("img");
  img.className = "";
  void img.offsetWidth;
  img.src = images[i];
  img.classList.add(effects[i % effects.length]);
  i++;
}
</script>
</body>
</html>
